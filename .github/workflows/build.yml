name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pack shared libraries
        # Services consume SakhaERP.Shared.* via PackageReference, not ProjectReference
        # (see docs/architecture/framework-rules.md), resolved from the local feed in nuget.config.
        run: |
          mkdir -p packages
          for proj in shared/*/*.csproj; do
            dotnet pack "$proj" -c Release -o packages
          done

      - name: Restore
        run: dotnet restore SakhaERP.sln

      - name: Build
        run: dotnet build SakhaERP.sln -c Release --no-restore

      - name: Test
        run: dotnet test SakhaERP.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
